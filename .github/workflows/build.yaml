name: build

# Called by ci: without release on every run, and with release after all tests of a tag passed. The
# caller gives the permissions.
on:
  workflow_call:
    inputs:
      release:
        description: Push the images and create the GitHub release
        type: boolean
        default: false

defaults:
  run:
    # unlike the default, it enables pipefail
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # to check that a tag is on master
          fetch-depth: 0

      - name: Check the version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" != tag ]]; then
            echo "version=dev-${GITHUB_SHA::7}" >>"${GITHUB_OUTPUT}"
            echo "tags=dev-${GITHUB_SHA::7}" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The tag ${GITHUB_REF_NAME} is not a version such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::The tag ${GITHUB_REF_NAME} is not on master"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          # as the Docker Official Images: 1.2.3, 1.2, 1 and latest, but no tag 0, and a pre-release moves none
          tags="${version}"
          if [[ "${version}" != *-* ]]; then
            tags+=" ${version%.*}"
            if [[ "${version%%.*}" != 0 ]]; then
              tags+=" ${version%%.*}"
            fi
            tags+=" latest"
            echo "latest=true" >>"${GITHUB_OUTPUT}"
          fi
          echo "tags=${tags}" >>"${GITHUB_OUTPUT}"

      - name: Log in to ghcr.io
        if: inputs.release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<<"${GITHUB_TOKEN}"

      # One builder for all, so that the images get the very binaries that are in the release's archives.
      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAGS: ${{ steps.version.outputs.tags }}
          PUSH: ${{ inputs.release }}
        run: |
          set -x
          docker buildx create --use
          docker buildx build . --target bin --build-arg "VERSION=${VERSION}" \
            --platform linux/amd64,linux/arm64 --output type=local,dest=build
          DOND_DEBUG=true build/linux_amd64/dond wrap true 2>&1 | grep -F "version ${VERSION},"
          # named and laid out for mise's github backend: dond at the root of the archive
          mkdir dist
          for arch in amd64 arm64; do
            tar -czf "dist/dond-linux-${arch}.tar.gz" -C "build/linux_${arch}" dond -C "${PWD}" LICENSE
          done
          (cd dist && sha256sum -- * | tee checksums.txt)

          # one package: the docker image at the version's tags, and only the binary at the same ones with -bin
          image_args=() bin_args=()
          for tag in ${TAGS}; do
            image_args+=(--tag "ghcr.io/felipecrs/dond:${tag}")
            if [[ "${tag}" == latest ]]; then
              bin_args+=(--tag ghcr.io/felipecrs/dond:bin)
            else
              bin_args+=(--tag "ghcr.io/felipecrs/dond:${tag}-bin")
            fi
          done
          for label in "source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "version=${VERSION}" "revision=${GITHUB_SHA}"; do
            image_args+=(--label "org.opencontainers.image.${label}" --annotation "index,manifest:org.opencontainers.image.${label}")
            bin_args+=(--label "org.opencontainers.image.${label}" --annotation "index,manifest:org.opencontainers.image.${label}")
          done
          docker buildx build . --target image --build-arg "VERSION=${VERSION}" \
            --platform linux/amd64,linux/arm64 "${image_args[@]}" --output "type=image,push=${PUSH}"
          docker buildx build . --target bin --build-arg "VERSION=${VERSION}" \
            --platform linux/amd64,linux/arm64 "${bin_args[@]}" --output "type=image,push=${PUSH}"

      - name: Create the release
        if: inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          args=()
          if [[ "${LATEST}" != true ]]; then
            args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes "${args[@]}" dist/*
